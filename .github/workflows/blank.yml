name: Borsa Bot Otomatik Çalışır

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'  # Türkiye saati ile 08:30 (veya 09:30 hedefli erkene alma)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Indir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          pip install yfinance pandas requests

      - name: Ana Botu Calistir
        run: python bot.py

      - name: Hizli Boti Calistir
        run: python hizli_bot.py
