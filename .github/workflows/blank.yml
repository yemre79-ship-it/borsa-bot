name: Borsa Bot Otomatik Calisir

on:
  schedule:
    # Her gün Türkiye saati ile sabah 09:30 (UTC 06:30)
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Indir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          pip install yfinance requests

      - name: Botu Calistir
        run: |
          python bot.py
